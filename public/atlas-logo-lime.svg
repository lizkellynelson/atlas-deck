<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Outer circle -->
  <circle cx="100" cy="100" r="90" fill="none" stroke="#ceff00" stroke-width="3"/>

  <!-- Horizontal lines (latitude) -->
  <ellipse cx="100" cy="40" rx="90" ry="18" fill="none" stroke="#ceff00" stroke-width="1.5"/>
  <ellipse cx="100" cy="70" rx="90" ry="21" fill="none" stroke="#ceff00" stroke-width="1.5"/>
  <ellipse cx="100" cy="100" rx="90" ry="30" fill="none" stroke="#ceff00" stroke-width="1.5"/>
  <ellipse cx="100" cy="130" rx="90" ry="21" fill="none" stroke="#ceff00" stroke-width="1.5"/>
  <ellipse cx="100" cy="160" rx="90" ry="18" fill="none" stroke="#ceff00" stroke-width="1.5"/>

  <!-- Vertical lines (longitude) -->
  <ellipse cx="100" cy="100" rx="90" ry="90" fill="none" stroke="#ceff00" stroke-width="1.5"/>
  <ellipse cx="100" cy="100" rx="78" ry="90" fill="none" stroke="#ceff00" stroke-width="1.5" transform="rotate(30 100 100)"/>
  <ellipse cx="100" cy="100" rx="52" ry="90" fill="none" stroke="#ceff00" stroke-width="1.5" transform="rotate(60 100 100)"/>
  <ellipse cx="100" cy="100" rx="26" ry="90" fill="none" stroke="#ceff00" stroke-width="1.5" transform="rotate(90 100 100)"/>
  <ellipse cx="100" cy="100" rx="52" ry="90" fill="none" stroke="#ceff00" stroke-width="1.5" transform="rotate(120 100 100)"/>
  <ellipse cx="100" cy="100" rx="78" ry="90" fill="none" stroke="#ceff00" stroke-width="1.5" transform="rotate(150 100 100)"/>

  <!-- ATLAS text centered -->
  <text x="100" y="110" font-family="Space Grotesk, sans-serif" font-size="32" font-weight="700" fill="#ceff00" text-anchor="middle">ATLAS</text>
</svg>
